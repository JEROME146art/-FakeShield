# ===== Server =====
server.port=${PORT:8090}

# ===== Database =====
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:testdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}

# Driver auto: if URL contains postgres use postgres driver
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.secret=${JWT_SECRET:FakeShieldDefaultSecretKeyThatIsLongEnoughForHS256Algorithm123456}
jwt.expiration=86400000