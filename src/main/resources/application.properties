# ===== Application =====
spring.application.name=FakeShield
server.port=${PORT:8090}

# ===== Database Configuration =====
# For local development (H2 in-memory)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# For H2 Console (local dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== File Upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-swallow-size=5MB

# ===== Memory Optimization =====
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=50
spring.jmx.enabled=false
# ===== JWT Configuration =====
jwt.secret=${JWT_SECRET:mySecretKeyForJWTThatShouldBeVeryLongAndSecureForProductionUse123456789}
jwt.expiration=86400000