# ===================================================================
# FakeShield - Complete Application Configuration
# ===================================================================

# ===== Server Configuration =====
spring.application.name=FakeShield
server.port=${PORT:8090}

# ===== Database Configuration (PostgreSQL on Railway / H2 Fallback Locally) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:fakeshielddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}

# ===== JPA & Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Fix Hibernate LazyInitializationException during JSON serialization
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ===== H2 Console (Local Development Only) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===== File Upload Limits (5MB Max) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-swallow-size=5MB

# ===== JWT Security Configuration =====
jwt.secret=${JWT_SECRET:FakeShieldDefaultSecretKeyThatIsLongEnoughForHS256Algorithm123456}
jwt.expiration=86400000

# ===== Memory & Performance Optimization (Railway 512MB RAM) =====
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=50
spring.jmx.enabled=false
spring.main.lazy-initialization=true

# ===== Telegram Bot (Disabled) =====
telegram.bot.enabled=false
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}

# ===== JSON Serialization =====
spring.jackson.serialization.fail-on-empty-beans=false