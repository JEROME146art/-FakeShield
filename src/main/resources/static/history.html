<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My History - FakeShield</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        .history-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .history-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .history-header h1 {
            font-size: 42px;
            background: linear-gradient(135deg, #00f2fe, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-number {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .stat-total .stat-number { color: #4facfe; }
        .stat-real .stat-number { color: #10b981; }
        .stat-fake .stat-number { color: #ef4444; }
        .stat-suspicious .stat-number { color: #f59e0b; }

        .history-list {
            display: grid;
            gap: 16px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
            transition: all 0.3s;
        }

        .history-item:hover {
            transform: translateX(4px);
            border-color: rgba(79, 172, 254, 0.3);
        }

        .history-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .status-REAL { background: rgba(16, 185, 129, 0.2); }
        .status-FAKE { background: rgba(239, 68, 68, 0.2); }
        .status-SUSPICIOUS { background: rgba(245, 158, 11, 0.2); }

        .history-info h3 {
            color: white;
            margin: 0 0 4px 0;
            font-size: 16px;
        }

        .history-info p {
            color: rgba(255, 255, 255, 0.6);
            margin: 0;
            font-size: 13px;
        }

        .history-score {
            font-size: 24px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .score-REAL { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .score-FAKE { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .score-SUSPICIOUS { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state h2 {
            color: white;
            margin-bottom: 12px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #4facfe;
            text-decoration: none;
            margin-bottom: 20px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(79, 172, 254, 0.1);
        }
    </style>
</head>
<body style="background: #0f0c29; min-height: 100vh;">
<div class="history-container">
    <a href="/" class="back-btn">← Back to Home</a>

    <div class="history-header">
        <h1>📜 My Analysis History</h1>
        <p style="color: rgba(255,255,255,0.7);">Your complete fake news detection history</p>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card stat-total">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">Total Analyses</div>
        </div>
        <div class="stat-card stat-real">
            <div class="stat-number" id="realCount">0</div>
            <div class="stat-label">✅ Real News</div>
        </div>
        <div class="stat-card stat-fake">
            <div class="stat-number" id="fakeCount">0</div>
            <div class="stat-label">❌ Fake News</div>
        </div>
        <div class="stat-card stat-suspicious">
            <div class="stat-number" id="suspiciousCount">0</div>
            <div class="stat-label">⚠️ Suspicious</div>
        </div>
    </div>

    <div class="history-list" id="historyList">
        <div style="text-align: center; padding: 40px; color: white;">Loading...</div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');

    if (!token) {
        alert('Please login to view your history');
        window.location.href = '/login.html';
    }

    async function loadStats() {
        try {
            const response = await fetch('/api/history/my-stats', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const stats = await response.json();

            document.getElementById('totalCount').textContent = stats.total || 0;
            document.getElementById('realCount').textContent = stats.real || 0;
            document.getElementById('fakeCount').textContent = stats.fake || 0;
            document.getElementById('suspiciousCount').textContent = stats.suspicious || 0;
        } catch (error) {
            console.error('Failed to load stats:', error);
        }
    }

    async function loadHistory() {
        try {
            const response = await fetch('/api/history/my-analyses', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const analyses = await response.json();

            const list = document.getElementById('historyList');

            if (analyses.length === 0) {
                list.innerHTML = `
                        <div class="empty-state">
                            <h2>📭 No analyses yet</h2>
                            <p>Start analyzing images to build your history!</p>
                            <a href="/" class="back-btn" style="margin-top: 20px;">Go analyze now →</a>
                        </div>
                    `;
                return;
            }

            list.innerHTML = analyses.map(a => `
                    <div class="history-item">
                        <div class="history-icon status-${a.status}">
                            ${a.status === 'REAL' ? '✅' : a.status === 'FAKE' ? '❌' : '⚠️'}
                        </div>
                        <div class="history-info">
                            <h3>${a.filename || 'Unknown'}</h3>
                            <p>📅 ${new Date(a.createdAt || Date.now()).toLocaleString()}</p>
                            <p>📊 Size: ${(a.fileSize / 1024).toFixed(1)} KB • Time: ${a.processingTimeMs}ms</p>
                        </div>
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <div class="history-score score-${a.status}">
                                ${a.credibilityScore ? a.credibilityScore.toFixed(0) : 0}%
                            </div>
                            <button class="delete-btn" onclick="deleteAnalysis(${a.id})">🗑️</button>
                        </div>
                    </div>
                `).join('');
        } catch (error) {
            console.error('Failed to load history:', error);
            document.getElementById('historyList').innerHTML = `
                    <div class="empty-state">
                        <h2>❌ Error loading history</h2>
                        <p>${error.message}</p>
                    </div>
                `;
        }
    }

    async function deleteAnalysis(id) {
        if (!confirm('Delete this analysis?')) return;

        try {
            const response = await fetch(`/api/history/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                loadStats();
                loadHistory();
            } else {
                alert('Failed to delete');
            }
        } catch (error) {
            console.error('Delete error:', error);
            alert('Error deleting analysis');
        }
    }

    loadStats();
    loadHistory();
</script>
</body>
</html>
