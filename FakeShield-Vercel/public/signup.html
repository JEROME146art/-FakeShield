<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FakeShield</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
<div class="auth-container">
    <div class="auth-background">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <span class="logo-icon">🛡️</span>
                <h1>FakeShield</h1>
            </div>
            <p class="auth-subtitle">Create your account & start detecting fake news!</p>
        </div>

        <form id="signupForm" class="auth-form">
            <div class="form-group">
                <label for="fullName">
                    <span class="label-icon">✨</span>
                    Full Name
                </label>
                <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="John Doe"
                        required
                >
            </div>

            <div class="form-group">
                <label for="username">
                    <span class="label-icon">👤</span>
                    Username
                </label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="johndoe"
                        minlength="3"
                        required
                >
                <small class="input-hint" id="usernameHint"></small>
            </div>

            <div class="form-group">
                <label for="email">
                    <span class="label-icon">📧</span>
                    Email
                </label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="john@example.com"
                        required
                >
                <small class="input-hint" id="emailHint"></small>
            </div>

            <div class="form-group">
                <label for="password">
                    <span class="label-icon">🔒</span>
                    Password
                </label>
                <div class="password-input">
                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Min 6 characters"
                            minlength="6"
                            required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">
                        👁️
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    <span class="label-icon">🔐</span>
                    Confirm Password
                </label>
                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter password"
                        required
                >
                <small class="input-hint" id="passwordMatchHint"></small>
            </div>

            <label class="checkbox-label terms-label">
                <input type="checkbox" id="terms" required>
                <span>I agree to the Terms of Service & Privacy Policy</span>
            </label>

            <button type="submit" class="auth-btn" id="signupBtn">
                <span class="btn-text">Create Account 🚀</span>
                <span class="btn-loader" style="display: none;">⏳</span>
            </button>

            <p class="auth-switch">
                Already have an account?
                <a href="/login.html">Login here</a>
            </p>
        </form>

        <div id="message" class="message"></div>
    </div>
</div>

<script src="auth.js"></script>
</body>
</html>
