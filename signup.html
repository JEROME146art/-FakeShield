<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FakeShield AI Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body class="auth-page">
    <!-- Ambient glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Language Selection Bar -->
            <div class="auth-lang-row">
                <select id="authLangSelect" class="auth-lang-select">
                    <option value="en">🇬🇧 English</option>
                    <option value="ta">🇮🇳 தமிழ் (Tamil)</option>
                    <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
                    <option value="es">🇪🇸 Español (Spanish)</option>
                    <option value="fr">🇫🇷 Français (French)</option>
                    <option value="de">🇩🇪 Deutsch (German)</option>
                </select>
            </div>

            <!-- Header -->
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <span class="auth-brand-logo">🛡️</span>
                    <span class="auth-brand-title">FakeShield</span>
                </a>
                <p class="auth-subtitle" id="authSubtitle">Create your account for AI verification</p>
            </div>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form" onsubmit="handleSignupSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="fullName">
                        <span>📝</span>
                        <span id="lblFullNameText">Full Name</span>
                    </label>
                    <input 
                        type="text" 
                        id="fullName" 
                        class="form-input" 
                        placeholder="e.g. Jerome Davis" 
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">
                        <span>👤</span>
                        <span id="lblUsernameText">Username</span>
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="e.g. jerome_ai" 
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">
                        <span>✉️</span>
                        <span>Email Address</span>
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="e.g. jerome@example.com" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">
                        <span>🏷️</span>
                        <span id="lblRoleText">Your Role / Organization</span>
                    </label>
                    <select id="role" class="form-select">
                        <option value="Fact Checker / Analyst">🛡️ Fact Checker / Analyst</option>
                        <option value="Journalist / Reporter">📰 Journalist / Reporter</option>
                        <option value="Academic Researcher">🎓 Academic Researcher</option>
                        <option value="General User / Reader" selected>👤 General User / Reader</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">
                        <span>🔒</span>
                        <span id="lblPasswordText">Password</span>
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Create a strong password" 
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="input-password-toggle" onclick="togglePassword('password', this)" title="Show/Hide Password">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">
                        <span>🔐</span>
                        <span id="lblConfirmPasswordText">Confirm Password</span>
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            class="form-input" 
                            placeholder="Re-enter your password" 
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="input-password-toggle" onclick="togglePassword('confirmPassword', this)" title="Show/Hide Password">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-auth-primary" id="btnSignupBtn">
                    <span id="btnSignupText">✨ Create Account</span>
                </button>

                <!-- Switch to Login -->
                <p class="auth-switch-text">
                    <span id="haveAccountText">Already have an account?</span>
                    <a href="login.html" id="linkLoginText">Login here</a>
                </p>
            </form>

            <!-- Alert notification box -->
            <div id="authAlert" class="auth-alert"></div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
