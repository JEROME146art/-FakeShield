<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Analysis History - FakeShield</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0A0E1A 0%, #121829 50%, #0F172A 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #F8FAFC;
        }

        .history-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        .top-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #00D4FF;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.2);
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.16);
            transform: translateX(-2px);
        }

        .history-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .history-header h1 {
            font-size: 38px;
            font-weight: 800;
            margin: 0 0 10px;
            background: linear-gradient(135deg, #00D4FF 0%, #A855F7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .history-header p {
            color: #94A3B8;
            margin: 0;
            font-size: 15px;
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.25);
            color: #00D4FF;
            font-size: 12px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(18, 24, 41, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .stat-number {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 6px;
            line-height: 1;
        }

        .stat-label {
            color: #94A3B8;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .stat-total .stat-number { color: #00D4FF; }
        .stat-real .stat-number { color: #10B981; }
        .stat-fake .stat-number { color: #EF4444; }
        .stat-suspicious .stat-number { color: #F59E0B; }

        /* Filter Controls */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(18, 24, 41, 0.6);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-pill {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94A3B8;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-pill:hover, .filter-pill.active {
            background: rgba(0, 212, 255, 0.15);
            color: #00D4FF;
            border-color: #00D4FF;
        }

        .search-input {
            padding: 8px 14px;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #F8FAFC;
            font-size: 13px;
            outline: none;
            width: 240px;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #00D4FF;
        }

        /* History Items List */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .history-item {
            background: rgba(18, 24, 41, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 18px;
            align-items: center;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            transform: translateX(3px);
            border-color: rgba(0, 212, 255, 0.25);
            background: rgba(22, 30, 52, 0.85);
        }

        .history-type-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .type-image { background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.3); }
        .type-url { background: rgba(0, 212, 255, 0.15); border: 1px solid rgba(0, 212, 255, 0.3); }
        .type-text { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); }

        .history-info {
            min-width: 0;
        }

        .history-info-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .history-title {
            color: #F8FAFC;
            font-size: 15px;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 0.5px;
        }

        .badge-real { background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-fake { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-suspicious { background: rgba(245, 158, 11, 0.15); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.3); }

        .history-snippet {
            color: #94A3B8;
            font-size: 12px;
            margin: 4px 0 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .history-meta {
            display: flex;
            gap: 12px;
            color: #64748B;
            font-size: 11px;
            flex-wrap: wrap;
        }

        .history-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .history-score {
            font-size: 20px;
            font-weight: 800;
            padding: 8px 14px;
            border-radius: 10px;
            min-width: 68px;
            text-align: center;
        }

        .score-REAL { color: #10B981; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.25); }
        .score-FAKE { color: #EF4444; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.25); }
        .score-SUSPICIOUS { color: #F59E0B; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.25); }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.25);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94A3B8;
            background: rgba(18, 24, 41, 0.5);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 14px;
        }

        .empty-state h2 {
            color: #F8FAFC;
            margin: 0 0 10px;
            font-size: 22px;
        }

        .loading-state {
            text-align: center;
            padding: 40px;
            color: #94A3B8;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .history-item {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .history-actions {
                justify-content: space-between;
            }
            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="history-container">
    <div class="top-nav-bar">
        <a href="/" class="back-btn">← Back to FakeShield</a>
        <button class="back-btn" onclick="refreshHistory()" style="cursor: pointer;">🔄 Refresh</button>
    </div>

    <div class="history-header">
        <h1>📜 Analysis History</h1>
        <p>Comprehensive record of all analyzed news, URLs, and images</p>
        <div class="user-badge" id="userBadge">Checking status...</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card stat-total">
            <div class="stat-number" id="totalCount">0</div>
            <div class="stat-label">Total Analyzed</div>
        </div>
        <div class="stat-card stat-real">
            <div class="stat-number" id="realCount">0</div>
            <div class="stat-label">✅ Verified Real</div>
        </div>
        <div class="stat-card stat-fake">
            <div class="stat-number" id="fakeCount">0</div>
            <div class="stat-label">❌ Fake News</div>
        </div>
        <div class="stat-card stat-suspicious">
            <div class="stat-number" id="suspiciousCount">0</div>
            <div class="stat-label">⚠️ Suspicious</div>
        </div>
    </div>

    <div class="controls-bar">
        <div class="filter-group">
            <button class="filter-pill active" onclick="setFilter('ALL', this)">All</button>
            <button class="filter-pill" onclick="setFilter('TEXT', this)">📝 Text</button>
            <button class="filter-pill" onclick="setFilter('URL', this)">🔗 URL</button>
            <button class="filter-pill" onclick="setFilter('IMAGE', this)">🖼️ Images</button>
            <button class="filter-pill" onclick="setFilter('REAL', this)">✅ Real</button>
            <button class="filter-pill" onclick="setFilter('FAKE', this)">❌ Fake</button>
            <button class="filter-pill" onclick="setFilter('SUSPICIOUS', this)">⚠️ Suspicious</button>
        </div>
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search history..." oninput="applyFilters()">
    </div>

    <div class="history-list" id="historyList">
        <div class="loading-state">Loading analysis history...</div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const userRaw = localStorage.getItem('user');
    let currentUser = null;
    let allAnalyses = [];
    let currentFilter = 'ALL';

    try {
        currentUser = userRaw ? JSON.parse(userRaw) : null;
    } catch (e) {
        currentUser = null;
    }

    const userBadge = document.getElementById('userBadge');
    if (token && currentUser) {
        userBadge.textContent = `👤 ${currentUser.fullName || currentUser.username || 'User'} (Synced Account)`;
    } else {
        userBadge.textContent = '👥 Public & Guest History (Log in to sync)';
    }

    function formatDate(value) {
        if (!value) return 'Just now';
        try {
            return new Date(value).toLocaleString();
        } catch (e) {
            return 'Just now';
        }
    }

    async function loadStats() {
        try {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const response = await fetch('/api/history/my-stats', { headers });
            if (response.ok) {
                const stats = await response.json();
                document.getElementById('totalCount').textContent = stats.total ?? 0;
                document.getElementById('realCount').textContent = stats.real ?? 0;
                document.getElementById('fakeCount').textContent = stats.fake ?? 0;
                document.getElementById('suspiciousCount').textContent = stats.suspicious ?? 0;
            }
        } catch (error) {
            console.error('Failed to load stats:', error);
        }
    }

    async function loadHistory() {
        const list = document.getElementById('historyList');

        try {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const response = await fetch('/api/history/my-analyses', { headers });

            if (!response.ok) {
                // Fallback to all public news if unauthorized
                const altRes = await fetch('/api/news/all');
                if (altRes.ok) {
                    allAnalyses = await altRes.json();
                    renderList();
                    return;
                }
                throw new Error(`Server error ${response.status}`);
            }

            allAnalyses = await response.json();
            if (!Array.isArray(allAnalyses)) allAnalyses = [];

            renderList();
        } catch (error) {
            console.error('Failed to load history:', error);
            list.innerHTML = `
                <div class="empty-state">
                    <h2>❌ Could not load history</h2>
                    <p>${error.message || 'Please verify server connection.'}</p>
                    <a href="/" class="back-btn">Return Home</a>
                </div>
            `;
        }
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        applyFilters();
    }

    function applyFilters() {
        renderList();
    }

    function renderList() {
        const list = document.getElementById('historyList');
        const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

        let filtered = allAnalyses.filter(item => {
            const type = (item.type || (item.imageType ? 'image' : (item.sourceUrl ? 'url' : 'text'))).toUpperCase();
            const status = (item.status || 'SUSPICIOUS').toUpperCase();

            // Filter match
            if (currentFilter === 'TEXT' && type !== 'TEXT') return false;
            if (currentFilter === 'URL' && type !== 'URL') return false;
            if (currentFilter === 'IMAGE' && type !== 'IMAGE') return false;
            if (currentFilter === 'REAL' && status !== 'REAL') return false;
            if (currentFilter === 'FAKE' && status !== 'FAKE') return false;
            if (currentFilter === 'SUSPICIOUS' && status !== 'SUSPICIOUS') return false;

            // Search query match
            if (query) {
                const title = (item.title || item.filename || '').toLowerCase();
                const content = (item.content || item.extractedText || '').toLowerCase();
                const exp = (item.explanation || '').toLowerCase();
                if (!title.includes(query) && !content.includes(query) && !exp.includes(query)) {
                    return false;
                }
            }

            return true;
        });

        if (filtered.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <h2>📭 No analyses found</h2>
                    <p>Try submitting text, a URL, or an image on the analyzer page.</p>
                    <a href="/" class="back-btn">Go to Analyzer →</a>
                </div>
            `;
            return;
        }

        list.innerHTML = filtered.map(item => {
            const status = (item.status || 'SUSPICIOUS').toUpperCase();
            const score = Math.round(item.credibilityScore ?? item.overallScore ?? 0);
            const isImage = item.type === 'image' || item.imageType || item.filename;
            const isUrl = item.type === 'url' || (item.sourceUrl && item.sourceUrl.length > 0);
            const typeClass = isImage ? 'type-image' : isUrl ? 'type-url' : 'type-text';
            const typeIcon = isImage ? '🖼️' : isUrl ? '🔗' : '📝';
            const typeName = isImage ? 'Image Analysis' : isUrl ? 'URL Analysis' : 'Text Analysis';

            const title = item.title || item.filename || 'Untitled News';
            const snippet = item.content || item.extractedText || item.explanation || 'No preview available.';
            const badgeClass = status === 'REAL' ? 'badge-real' : status === 'FAKE' ? 'badge-fake' : 'badge-suspicious';
            const badgeText = status === 'REAL' ? '✅ Verified Real' : status === 'FAKE' ? '❌ Fake News' : '⚠️ Suspicious';

            return `
                <div class="history-item">
                    <div class="history-type-icon ${typeClass}">
                        ${typeIcon}
                    </div>
                    <div class="history-info">
                        <div class="history-info-header">
                            <h3 class="history-title" title="${escapeHtml(title)}">${escapeHtml(title)}</h3>
                            <span class="history-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <p class="history-snippet">${escapeHtml(snippet)}</p>
                        <div class="history-meta">
                            <span>🏷️ ${typeName}</span>
                            <span>📅 ${formatDate(item.createdAt || item.uploadedAt || item.submittedAt)}</span>
                            ${item.fileSize ? `<span>📦 ${(Number(item.fileSize)/1024).toFixed(1)} KB</span>` : ''}
                            ${item.platform ? `<span>🌐 ${escapeHtml(item.platform)}</span>` : ''}
                        </div>
                    </div>
                    <div class="history-actions">
                        <div class="history-score score-${status}">
                            ${score}%
                        </div>
                        <button class="delete-btn" onclick="deleteItem(${item.id}, '${isImage ? 'image' : 'news'}')" title="Delete entry">
                            🗑️
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function deleteItem(id, type) {
        if (!id) return;
        if (!confirm('Are you sure you want to delete this analysis record?')) return;

        try {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const response = await fetch(`/api/history/${id}?type=${type}`, {
                method: 'DELETE',
                headers: headers
            });

            if (response.ok) {
                allAnalyses = allAnalyses.filter(a => a.id !== id);
                renderList();
                loadStats();
            } else {
                alert('Could not delete record.');
            }
        } catch (e) {
            alert('Error deleting record: ' + e.message);
        }
    }

    function refreshHistory() {
        loadStats();
        loadHistory();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // Initial Load
    loadStats();
    loadHistory();
</script>
</body>
</html>
